name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Gepinnt: 0.16.0 erweitert die Default-Regeln und bricht den Lint ohne Codeänderung
      - name: Ruff installieren
        run: pip install ruff==0.15.22
      - name: Lint ausführen
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install Pillow PyMuPDF pillow-heif pytest
      - name: Tests ausführen
        run: pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Security-Werkzeuge installieren
        run: pip install bandit==1.9.4 pip-audit==2.10.1
      # Nur ausgelieferter Code; tests/ sind nicht Teil der Binaries
      - name: Bandit (statisches Security-Linting)
        run: >
          bandit picconverter_core.py picconverter_cli.py
          picconverter_gui.py picconverter_i18n.py
      - name: pip-audit (bekannte CVEs in Abhängigkeiten)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-build.txt --no-deps
