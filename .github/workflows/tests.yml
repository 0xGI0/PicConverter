name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Gepinnt: 0.16.0 erweitert die Default-Regeln und bricht den Lint ohne Codeänderung
      - name: Ruff installieren
        run: pip install ruff==0.15.22
      - name: Lint ausführen
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install Pillow PyMuPDF pillow-heif pytest
      - name: Tests ausführen
        run: pytest tests/ -v
